# Prometheus Configuration for Accrua

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'accrua-dev'
    environment: 'development'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "alerts.yml"

# Scrape configurations
scrape_configs:
  # Accrua Application
  - job_name: 'accrua-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          application: 'accrua-metering'
          instance: 'dev'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Kafka Exporter (if available)
  - job_name: 'kafka'
    static_configs:
      - targets: []
        # - targets: ['kafka-exporter:9308']

  # PostgreSQL Exporter (if available)
  - job_name: 'postgres'
    static_configs:
      - targets: []
        # - targets: ['postgres-exporter:9187']

  # Redis Exporter (if available)
  - job_name: 'redis'
    static_configs:
      - targets: []
        # - targets: ['redis-exporter:9121']

spring:
  application:
    name: accrua-metering

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # R2DBC Configuration
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/accrua}
    username: ${DB_USERNAME:accrua}
    password: ${DB_PASSWORD:secret}
    pool:
      initial-size: 10
      max-size: 50
      max-idle-time: 30m
      max-acquire-time: 3s
      validation-query: SELECT 1

  # Flyway Configuration (JDBC for migrations)
  flyway:
    enabled: true
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/accrua}
    user: ${DB_USERNAME:accrua}
    password: ${DB_PASSWORD:secret}
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 2147483647 # Max value for exactly-once
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        compression.type: snappy
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: accrua-metering
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
        spring.json.trusted.packages: com.accrua.*
    topics:
      usage-events: usage-events
      decay-events: decay-events
      settlement-events: settlement-events
      anomaly-events: anomaly-events
      balance-snapshots: balance-snapshots

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 50
          max-idle: 10
          min-idle: 5
          max-wait: 3s

  # Security Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081/realms/accrua}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/realms/accrua/protocol/openid-connect/certs}

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  http2:
    enabled: true

# Management & Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
  tracing:
    sampling:
      probability: 1.0
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.accrua: DEBUG
    org.springframework.r2dbc: DEBUG
    org.springframework.kafka: INFO
    io.r2dbc.postgresql.QUERY: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Accrua Custom Configuration
accrua:
  # Idempotency Configuration
  idempotency:
    enabled: true
    ttl: 7d # Keep idempotency keys for 7 days
    bloom-filter:
      expected-insertions: 10000000
      false-positive-probability: 0.01

  # Time Decay Configuration
  decay:
    scheduler:
      enabled: true
      cron: "0 0 * * * *" # Every hour
    policies:
      linear:
        rate: 0.01 # 1% per day
      expiration:
        default-duration: 30d

  # Rules Engine Configuration
  rules:
    evaluation:
      parallel: true
      max-concurrent: 10
    cache:
      enabled: true
      ttl: 5m

  # Billing Configuration
  billing:
    invoice:
      generation:
        enabled: true
        cron: "0 0 1 * * *" # Daily at 1 AM
      default-due-days: 30
    pricing:
      cache-ttl: 15m

  # Anomaly Detection Configuration
  anomaly:
    detection:
      enabled: true
      min-history-size: 30
      z-score-threshold: 3.0
      spike-ratio: 5.0
    alerts:
      channels:
        - email
        - webhook

  # Performance Configuration
  performance:
    batch-size: 100
    concurrent-requests: 1000
    backpressure:
      buffer-size: 1000
      strategy: DROP_OLDEST

  # Multi-tenancy Configuration
  multi-tenancy:
    enabled: true
    header-name: X-Tenant-ID
    required: true

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    com.accrua: DEBUG
    org.springframework.r2dbc: TRACE

accrua:
  decay:
    scheduler:
      enabled: false # Disable in dev for testing
  billing:
    invoice:
      generation:
        enabled: false # Disable in dev

---
# Test Profile
spring:
  config:
    activate:
      on-profile: test

  r2dbc:
    url: r2dbc:h2:mem:///testdb?options=DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

  flyway:
    enabled: false

  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}

logging:
  level:
    root: WARN
    com.accrua: DEBUG

---
# Production Profile
spring:
  config:
    activate:
      on-profile: production

logging:
  level:
    root: WARN
    com.accrua: INFO
    org.springframework.r2dbc: WARN

accrua:
  idempotency:
    bloom-filter:
      expected-insertions: 100000000
  performance:
    concurrent-requests: 10000
